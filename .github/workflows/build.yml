name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GlassLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher
          path: GlassLauncher.apk

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GlassLauncher.apk \
            --title "גרסה ${{ github.run_number }}" \
            --notes "קובץ להתקנה: GlassLauncher.apk"

  ui-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GlassLauncher

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/ui-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

      - name: Save screenshots to the "screenshots" branch
        if: always()
        run: |
          cd shots
          git init -q -b screenshots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots of run ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
