name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch open-licence Hebrew font (Heebo, OFL)
        run: |
          mkdir -p app/src/main/res/font app/src/main/assets/licenses
          curl -fsSL -o app/src/main/res/font/heebo.ttf "https://github.com/google/fonts/raw/main/ofl/heebo/Heebo%5Bwght%5D.ttf" || rm -f app/src/main/res/font/heebo.ttf
          curl -fsSL -o app/src/main/assets/licenses/heebo-OFL.txt "https://github.com/google/fonts/raw/main/ofl/heebo/OFL.txt" || true

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GlassLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher
          path: GlassLauncher.apk

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub sometimes answers 500 here; try a few times.
          for i in 1 2 3 4 5; do
            gh release delete latest --yes --cleanup-tag || true
            sleep 3
            if gh release create latest GlassLauncher.apk \
                --title "גרסה ${{ github.run_number }}" \
                --notes "קובץ להתקנה: GlassLauncher.apk"; then exit 0; fi
            sleep 10
          done
          exit 1

  ui-test:
    # Only on demand (Actions → Run workflow): the virtual-phone run takes ~10 minutes.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GlassLauncher

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/ui-test.sh

      - name: Save screenshots to the ci-shots branch
        if: always()
        run: |
          cd shots
          rm -f ui.xml
          git init -q -b ci-shots
          git config user.name "ci"; git config user.email "ci@example.com"
          git add -A
          git commit -qm "Screenshots for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
